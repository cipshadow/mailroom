# Lives at the repo root, since kindle-mailroom/ is the repo root here
# (github.com/cipshadow/mailroom). See scripts/publish.md in the private
# monorepo for the promotion story.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Test (fast suite; Kindle Previewer tests are macOS-only, see previewer job)
        run: pytest -q

  previewer:
    # Run the macOS Previewer suite for pull requests explicitly labeled previewer.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'previewer')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Check for Kindle Previewer
        id: kpr
        run: echo "present=$(command -v kindlepreviewer >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Previewer suite
        if: steps.kpr.outputs.present == 'true'
        run: pytest -q -m previewer
      - name: Previewer unavailable
        if: steps.kpr.outputs.present != 'true'
        run: |
          echo "::warning::Kindle Previewer is not installed on this runner; previewer suite skipped. Run it locally before release (see CONTRIBUTING.md)."
